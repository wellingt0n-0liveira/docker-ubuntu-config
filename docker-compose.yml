services:
  # --- CAMADA DE PROXY E HTTPS ---
  nginx-proxy-manager:
    image: 'jc21/nginx-proxy-manager:latest'
    container_name: nginx-proxy-manager
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
      - '81:81'
    volumes:
      - ./npm_data:/data
      - ./npm_letsencrypt:/etc/letsencrypt
    networks:
      - homelab_net

  # --- BANCO DE DADOS ---
  bookstack_db:
    image: lscr.io/linuxserver/mariadb:latest
    container_name: bookstack_db
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Sao_Paulo
      - MYSQL_ROOT_PASSWORD=SenhaRootMuitoForte123!
      - MYSQL_DATABASE=bookstackapp
      - MYSQL_USER=bookstack_user
      - MYSQL_PASSWORD=SenhaUserMuitoForte456!
    volumes:
      - ./db_data:/config
    networks:
      - homelab_net

  # --- DOCUMENTAÇÃO ---
  bookstack:
    image: lscr.io/linuxserver/bookstack:latest
    container_name: bookstack
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Sao_Paulo
      - APP_URL=https://bookstack.oniromante.com.br
      - APP_KEY=base64:8bXhFz7Y9Q2wJ4kL6mN5pR1sT0vW3xY8zA1bC2dE3fG=
      - DB_HOST=bookstack_db
      - DB_PORT=3306
      - DB_DATABASE=bookstackapp
      - DB_USERNAME=bookstack_user
      - DB_PASSWORD=SenhaUserMuitoForte456!
      - DRAWIO_SOURCE_URL=https://diagrams.net
    volumes:
      - ./app_data:/config
    depends_on:
      - bookstack_db
    networks:
      - homelab_net

networks:
  homelab_net:
    name: homelab_network
    driver: bridge
